<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .password-box {
        position: relative;
    }

    input {
        width: 100%;
        padding: 14px;
        padding-right: 50px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        border-color: #667eea;
    }

    #togglePassword {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #666;
        font-size: 14px;
    }

    .strength-bar {
        height: 8px;
        background: #ddd;
        border-radius: 10px;
        margin-top: 15px;
        overflow: hidden;
    }

    #strengthProgress {
        height: 100%;
        width: 0%;
        transition: 0.3s;
    }

    #strengthText {
        text-align: center;
        margin-top: 10px;
        font-weight: bold;
    }

    .requirements {
        margin-top: 20px;
    }

    .requirements p {
        margin: 8px 0;
        color: #777;
    }

    .valid {
        color: #28a745 !important;
    }

    .valid::before {
        content: "✓ ";
    }

    .invalid::before {
        content: "✗ ";
    }
</style>

<body>

```
<div class="container">

    <h1>Password Strength</h1>

    <div class="password-box">
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <span id="togglePassword">Show</span>
    </div>

    <div class="strength-bar">
        <div id="strengthProgress"></div>
    </div>

    <p id="strengthText">Enter a password</p>

    <div class="requirements">
        <p id="length" class="invalid">
            At least 8 characters
        </p>

        <p id="uppercase" class="invalid">
            At least one uppercase letter
        </p>

        <p id="lowercase" class="invalid">
            At least one lowercase letter
        </p>

        <p id="number" class="invalid">
            At least one number
        </p>

        <p id="special" class="invalid">
            At least one special character
        </p>
    </div>

</div>

<script>
    const password = document.getElementById("password");
    const strengthText = document.getElementById("strengthText");
    const strengthProgress = document.getElementById("strengthProgress");

    const lengthCheck = document.getElementById("length");
    const uppercaseCheck = document.getElementById("uppercase");
    const lowercaseCheck = document.getElementById("lowercase");
    const numberCheck = document.getElementById("number");
    const specialCheck = document.getElementById("special");

    const togglePassword = document.getElementById("togglePassword");

    password.addEventListener("input", function () {

        const value = password.value;

        let score = 0;

        // Check password requirements
        const hasLength = value.length >= 8;
        const hasUppercase = /[A-Z]/.test(value);
        const hasLowercase = /[a-z]/.test(value);
        const hasNumber = /[0-9]/.test(value);
        const hasSpecial = /[!@#$%^&*(),.?":{}|<>_\-+=/\\[\]]/.test(value);

        // Update requirement indicators
        updateCheck(lengthCheck, hasLength);
        updateCheck(uppercaseCheck, hasUppercase);
        updateCheck(lowercaseCheck, hasLowercase);
        updateCheck(numberCheck, hasNumber);
        updateCheck(specialCheck, hasSpecial);

        // Calculate score
        if (hasLength) score++;
        if (hasUppercase) score++;
        if (hasLowercase) score++;
        if (hasNumber) score++;
        if (hasSpecial) score++;

        // Display strength
        if (value.length === 0) {
            strengthText.textContent = "Enter a password";
            strengthText.style.color = "#777";
            strengthProgress.style.width = "0%";
            strengthProgress.style.background = "#ddd";
        }
        else if (score <= 2) {
            strengthText.textContent = "Weak";
            strengthText.style.color = "#dc3545";
            strengthProgress.style.width = "30%";
            strengthProgress.style.background = "#dc3545";
        }
        else if (score === 3 || score === 4) {
            strengthText.textContent = "Medium";
            strengthText.style.color = "#ffc107";
            strengthProgress.style.width = "65%";
            strengthProgress.style.background = "#ffc107";
        }
        else {
            strengthText.textContent = "Strong";
            strengthText.style.color = "#28a745";
            strengthProgress.style.width = "100%";
            strengthProgress.style.background = "#28a745";
        }
    });

    function updateCheck(element, valid) {
        if (valid) {
            element.classList.remove("invalid");
            element.classList.add("valid");
        } else {
            element.classList.remove("valid");
            element.classList.add("invalid");
        }
    }

    // Show / Hide password
    togglePassword.addEventListener("click", function () {

        if (password.type === "password") {
            password.type = "text";
            togglePassword.textContent = "Hide";
        } else {
            password.type = "password";
            togglePassword.textContent = "Show";
        }
    });
</script>
